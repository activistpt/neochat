name: 🚂 Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    name: Deploy NEOCHAT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Deploy to Railway
        uses: railwayapp/cli-action@v8
        with:
          api-token: ${{ secrets.RAILWAY_TOKEN }}
          service: worker
          railway_options: link --project ${{ secrets.RAILWAY_PROJECT_ID }}
