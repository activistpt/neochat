# NEOCHAT Nginx Configuration
events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    
    # HTTPS
    server {
        listen 443 ssl http2;
        server_name neochat.example.com;
        
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: ws:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;
        
        # WebSocket support
        location /socket.io/ {
            proxy_pass http://neochat:3000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        
        # API routes
        location /api/ {
            proxy_pass http://neochat:3000/api/;
            limit_req zone=chat burst=20 nodelay;
            limit_conn conn 10;
        }
        
        # Tor .onion files
        location /.well-known/ {
            root /usr/share/nginx/html;
        }
    }
    
    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name neochat.example.com;
        return 301 https://$server_name$request_uri;
    }
}
